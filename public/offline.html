<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#69C9FF" />
    <title>FLAPPY FACE — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #49b4ff 0%, #69c9ff 55%, #9be4ff 100%);
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
        color: #24415c;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        width: 100%;
        max-width: 320px;
        background: #ffffff;
        border: 3px solid #24415c;
        border-radius: 26px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 8px 0 #24415c, 0 18px 36px rgba(36, 65, 92, 0.25);
      }
      img {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        border: 3px solid #24415c;
      }
      h1 {
        margin: 14px 0 6px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 18px;
        font-size: 0.9rem;
        line-height: 1.45;
        opacity: 0.85;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        background: linear-gradient(180deg, #ffe46b 0%, #ffd84d 100%);
        border: 3px solid #24415c;
        border-radius: 9999px;
        color: #24415c;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 4px 0 #24415c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/pwa-192x192.png" alt="FLAPPY FACE Icon" />
      <h1>FLAPPY FACE</h1>
      <p>You are currently offline. Launch the cached game home screen to keep flying!</p>
      <a href="/">PLAY OFFLINE</a>
    </div>
  </body>
</html>
